name: Dependency vulnerability audit
on:
  push:
    branches: [main]
    paths: [requirements.txt, '.github/workflows/dependency-audit.yml']
  pull_request:
    paths: [requirements.txt, '.github/workflows/dependency-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit Python dependency declarations
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt
