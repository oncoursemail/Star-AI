name: Luau template specs

on:
  pull_request:
    paths:
      - 'examples/**'
      - 'scripts/run_luau_specs.py'
      - '.github/workflows/luau-specs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luau-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Luau Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/luau-ubuntu.zip \
            https://github.com/luau-lang/luau/releases/download/0.691/luau-ubuntu.zip
          echo '9b7699968c911beb3781f682c6be298440879ae279ff352d36dd58603418de2b  /tmp/luau-ubuntu.zip' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/luau"
          unzip -q /tmp/luau-ubuntu.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
      - name: Run every Luau spec
        run: python3 scripts/run_luau_specs.py
