name: STAR Website — React build & GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: star-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-website:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck and build the React website and app shell
        working-directory: frontend
        run: npm run build
      - name: Inspect produced public artifacts
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          ! grep -R -l -E 'BEGIN .*PRIVATE KEY|STAR_UPDATE_TOKEN|GITHUB_TOKEN=' frontend/dist
      - name: Upload verified website preview
        uses: actions/upload-artifact@v4
        with:
          name: STAR-React-Website
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/

  deploy:
    needs: build-website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy STAR React site
        uses: actions/deploy-pages@v4
        id: deployment
