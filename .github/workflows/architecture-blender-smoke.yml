name: STAR Blender Architecture Smoke
on:
  push:
    branches: ['star/**']
    paths:
      - 'star/architecture_pipeline.py'
      - 'star/architecture_quality.py'
      - 'scripts/blender_building.py'
      - 'examples/architecture/**'
      - '.github/workflows/architecture-blender-smoke.yml'
  pull_request:
    paths:
      - 'star/architecture_pipeline.py'
      - 'star/architecture_quality.py'
      - 'scripts/blender_building.py'
      - 'examples/architecture/**'
      - '.github/workflows/architecture-blender-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-export:
    name: Real Blender GLB export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Blender without any third-party add-ons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil
          blender --version | head -n 2
      - name: Generate a real Blender source file and GLB
        run: |
          # The distro Blender's embedded Python does not see apt's dist-packages
          # unless this explicitly trusted CI process enables the system environment.
          # STAR's ordinary Blender launch intentionally does NOT enable this mode.
          mkdir -p "$RUNNER_TEMP/star-blender-bin"
          printf '%s\n' '#!/bin/sh' 'exec /usr/bin/blender --python-use-system-env "$@"' \
            > "$RUNNER_TEMP/star-blender-bin/blender"
          chmod 755 "$RUNNER_TEMP/star-blender-bin/blender"
          PYTHONPATH=/usr/lib/python3/dist-packages \
            python -m star.architecture_pipeline examples/architecture/storybook_shop.json \
            --out architecture-smoke-output --blender "$RUNNER_TEMP/star-blender-bin/blender"
      - name: Verify independent exported GLB evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from star.architecture_quality import inspect_glb
          root = Path("architecture-smoke-output")
          manifest = json.loads((root / "asset-manifest.json").read_text())
          assert manifest["status"] == "exported_needs_studio_review"
          assert manifest["visual_quality_verified"] is False
          assert manifest["studio_imported"] is False
          assert (root / "building.blend").stat().st_size > 5000
          report = inspect_glb(root / "building.glb", expected_material_roles=("wall", "roof", "door", "glass", "trim"))
          assert report["mesh_count"] == 5, report
          print(json.dumps(report, indent=2))
          PY
      - name: Preserve inspectable sample assets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: STAR-Blender-Architecture-Smoke
          path: architecture-smoke-output/
          if-no-files-found: ignore
          retention-days: 7
