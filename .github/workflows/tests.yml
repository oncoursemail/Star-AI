name: STAR offline checks
on:
  push:
    branches: [main, 'star/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: star-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Offline Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install reviewed dependencies and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q star main.py
      - name: Validate research evaluation catalog
        run: python -m pytest -q tests/test_star_research.py
      - name: Run all offline regression tests
        run: python -m pytest -q

  react:
    name: React UI compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed frontend dependencies
        run: npm install --prefix frontend --no-audit --no-fund
      - name: Typecheck React and validate components
        run: |
          npm run typecheck --prefix frontend
          npm run test --prefix frontend
          npm run build --prefix frontend
      - name: Confirm built offline application entry point
        run: test -s frontend/dist/index.html
