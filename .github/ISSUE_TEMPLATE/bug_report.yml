name: Bug report
description: Something in STAR is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, API keys, tokens, private IP addresses, host names or personal paths. Redact logs first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: STAR version and OS
      placeholder: e.g. release version, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      render: shell
  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I removed secrets, private IPs, host names and user names from anything I pasted
          required: true
