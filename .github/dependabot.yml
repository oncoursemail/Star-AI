version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    # Require a separate compatibility suite before major AI-client/MCP migrations.
    ignore:
      - dependency-name: openai
        versions: [">=3.0.0"]
      - dependency-name: mcp
        versions: [">=2.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
