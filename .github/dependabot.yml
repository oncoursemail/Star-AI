version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: star/next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
    # Require a separate compatibility suite before major AI-client/MCP migrations.
    ignore:
      - dependency-name: openai
        versions: [">=3.0.0"]
      - dependency-name: mcp
        versions: [">=2.0.0"]
  - package-ecosystem: npm
    directory: /frontend
    target-branch: star/next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: star/next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
