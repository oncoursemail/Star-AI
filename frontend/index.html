<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090B0E" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="STAR Intelligence is a local-first Windows AI workspace. Use a model on this PC or your own STAR Server, get sourced Roblox help, and work with Studio under your control." />
    <meta property="og:title" content="STAR Intelligence" />
    <meta property="og:description" content="Local-first AI for Roblox work, with on-device or self-hosted models and project-scoped context." />
    <meta property="og:type" content="website" />
    <title>STAR Intelligence: a local-first AI workspace for Windows</title>
    <link rel="icon" type="image/svg+xml" href="./star-mark.svg" />
    <!-- The website build prerenders the landing page into #root. The desktop shell and the read-only preview
         load this same file with ?desktop=1 or ?preview=1 and must never show that markup, not even for a frame. -->
    <script>if(/[?&](desktop|preview)(=|&|$)/.test(location.search))document.documentElement.setAttribute('data-star-app','')</script>
    <style>html{background:#090B0E}[data-star-app] #root>.sw{display:none}</style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="max-width:40rem;margin:4rem auto;padding:0 1.5rem;font:16px/1.6 Segoe UI,system-ui,sans-serif;color:#F2F3F0">
        STAR Intelligence is a local-first AI workspace for Windows. This page needs JavaScript to show more.
        <a href="https://github.com/oncoursemail/Star-AI/releases/latest" style="color:#E8BF76">Download the latest release on GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
